[package]
name = "oak_sev_guest"
version = "0.1.0"
authors = ["Conrad Grobler <grobler@google.com>"]
edition = "2021"
license = "Apache-2.0"

[features]
default = ["rust-crypto"]
rust-crypto = ["aes-gcm"]

[dependencies]
aes-gcm = { version = "0.11", optional = true, default-features = false, features = [
  "aes",
] }
bitflags = "2.3"
lock_api = "0.4"
oak_sev_snp_attestation_report = { workspace = true }
spinning_top = "0.3"
static_assertions = "1"
snafu = { version = "0.9", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
zerocopy = { version = "0.8", features = ["derive"] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions"] }
